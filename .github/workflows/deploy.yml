# https://github.com/EPFL-ENAC/epfl-enac-build-push-deploy-action#readme
# dev branch -> dev overlay, v*.*.* tag -> prod overlay, in
# enack8s-app-config/epfl-eesd/modernmasonrydatabase.
name: deploy

on:
  push:
    branches: [dev]
    tags: ['v*.*.*']
  # A tag created by release-please with a token that cannot trigger workflows
  # deploys nothing; then run this by hand on the tag:
  #   gh workflow run deploy.yml --ref v<version>
  workflow_dispatch:

# Two close pushes could finish in the wrong order and write the older digest
# last, so a new run cancels the one still going.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    # v3.11.0+: pulls LFS from the server named in .lfsconfig (ENAC-IT's).
    uses: EPFL-ENAC/epfl-enac-build-push-deploy-action/.github/workflows/deploy.yml@v4.2.0
    secrets:
      token: ${{ secrets.CD_TOKEN }}
      # ENAC-IT Git LFS server, full-access token (Infisical epfl-enac/git-lfs):
      # GitHub runners are outside the EPFL network.
      lfs_username: ${{ secrets.GIT_LFS_AUTH_USERNAME }}
      lfs_password: ${{ secrets.GIT_LFS_AUTH_PASSWORD }}
    with:
      skip_vulnerability_scan: false
      org: epfl-eesd
      repo: modernmasonrydatabase
      build_context: '["./backend", "./frontend"]'
      # lfs: sets the ENAC-IT LFS header (from .lfsconfig) that fetch-data.sh reuses.
      lfs: true
      # The dataset comes from EPFL-ENAC/eesd-modern-masonry-walls-data, photos included.
      # A v* tag (prod) takes its newest data-* tag (main if none), else dev.
      # Only DATA_REF goes to stdout: stdout becomes Docker build args.
      build_args_script: |
        repo=https://github.com/EPFL-ENAC/eesd-modern-masonry-walls-data.git
        ref=dev
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          tag=$(git ls-remote --tags --sort=-v:refname "$repo" 'data-*' \
            | sed -n '/refs\/tags\/data-[^^]*$/{s#.*refs/tags/##p;q;}')
          ref=${tag:-main}
        fi
        DATA_REF=$ref bash frontend/scripts/fetch-data.sh >&2
        echo "DATA_REF=$ref"
