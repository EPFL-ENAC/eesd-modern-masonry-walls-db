# https://github.com/EPFL-ENAC/epfl-enac-build-push-deploy-action#readme
# dev branch -> dev overlay, v*.*.* tag -> prod overlay, in
# enack8s-app-config/epfl-eesd/modernmasonrydatabase.
name: deploy

on:
  push:
    branches: [dev]
    tags: ['v*.*.*']
  # A tag created by release-please with a token that cannot trigger workflows
  # deploys nothing; then run this by hand on the tag:
  #   gh workflow run deploy.yml --ref v<version>
  workflow_dispatch:

# Two close pushes could finish in the wrong order and write the older digest
# last, so a new run cancels the one still going.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    # Temporary: the branch of EPFL-ENAC/epfl-enac-build-push-deploy-action#33, which
    # pulls LFS from the .lfsconfig server. Pin its release tag before merging.
    uses: EPFL-ENAC/epfl-enac-build-push-deploy-action/.github/workflows/deploy.yml@feat/self-hosted-lfs
    secrets:
      token: ${{ secrets.CD_TOKEN }}
      # ENAC-IT Git LFS server, full-access token (Infisical epfl-enac/git-lfs):
      # GitHub runners are outside the EPFL network.
      lfs_username: ${{ secrets.ENAC_LFS_USERNAME }}
      lfs_password: ${{ secrets.ENAC_LFS_PASSWORD }}
    with:
      org: epfl-eesd
      repo: modernmasonrydatabase
      build_context: '["./backend", "./frontend"]'
      # The specimen photos in frontend/public/data are git-lfs objects, on the
      # ENAC-IT server named in .lfsconfig.
      lfs: true
