name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test:unit run
      - run: pnpm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen
      - run: uv run pre-commit run --all-files
      - run: uv run pytest
  submissions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List changed submissions
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ids=$(git diff --name-only "$BASE_SHA" HEAD -- ../submissions \
            | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.changed.outputs.ids != ''
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Check each changed submission
        if: steps.changed.outputs.ids != ''
        env:
          IDS: ${{ steps.changed.outputs.ids }}
        run: |
          uv sync --frozen
          status=0
          for id in $IDS; do
            if [ ! -d "../submissions/$id" ]; then echo "skip $id: removed"; continue; fi
            echo "::group::submissions/$id"
            uv run python -m modernmasonrydatabase.contribution "../submissions/$id" || status=1
            echo "::endgroup::"
          done
          exit $status
