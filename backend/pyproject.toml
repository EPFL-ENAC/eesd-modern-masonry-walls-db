[project]
name = "modernmasonrydatabase"
version = "0.3.0"
description = "EESD Modern Masonry Walls DB backend"
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic>=2,<3",
  "dynaconf>=3.1.7,<4",
  "uvicorn>=0.30,<1",
  "enacit4r-contrib[github]",
  "httpx>=0.27,<1",
  "mmw-data",
]

[dependency-groups]
dev = [
  "pytest>=7.1.2,<8",
  "pytest-asyncio>=0.23,<0.24",
  "httpx>=0.27,<1",
  "pre-commit>=3.0.4,<4",
  "ruff>=0.9,<1",
]

[tool.uv.sources]
enacit4r-contrib = { git = "https://github.com/EPFL-ENAC/enacit4r-contrib", tag = "0.6.1" }
mmw-data = { git = "https://github.com/EPFL-ENAC/eesd-modern-masonry-walls-data", tag = "tools-0.2.1", subdirectory = "tools" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modernmasonrydatabase"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
