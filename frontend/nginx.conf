user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events {
  worker_connections  1024;
}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;
  keepalive_timeout  65;

  gzip              on;
  gzip_vary         on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css text/javascript text/csv
                    application/javascript application/json application/wasm
                    image/svg+xml font/ttf font/otf;

  server {
    listen       80;
    server_name  localhost;

    # Content-hashed build assets are immutable: cache them aggressively.
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico|csv|wasm)$ {
      root        /app;
      expires     1y;
      add_header  Cache-Control "public, immutable";
      try_files   $uri =404;
    }

    # The SPA entry point must always be revalidated so deploys aren't stale.
    location = /index.html {
      root        /app;
      add_header  Cache-Control "no-cache";
    }

    location / {
      root   /app;
      index  index.html;
      try_files $uri $uri/ /index.html;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
