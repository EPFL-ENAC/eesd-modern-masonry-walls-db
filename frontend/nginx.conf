worker_processes  1;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  types {
    text/csv  csv;
  }
  access_log  /dev/stdout;
  sendfile        on;
  keepalive_timeout  65;

  # nginx-unprivileged runs as uid 101: temp paths must be writable.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  gzip              on;
  gzip_vary         on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css text/javascript text/csv
                    application/javascript application/json
                    image/svg+xml font/ttf font/otf;

  server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;

    location = /ready {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Content-hashed build assets are immutable.
    location /assets/ {
      expires     1y;
      add_header  Cache-Control "public, immutable";
      try_files   $uri =404;
    }

    # The dataset keeps its file names across updates: cache for a day.
    location /data/ {
      expires     1d;
      add_header  Cache-Control "public";
      try_files   $uri =404;
    }

    # The SPA entry point is always revalidated so deploys are never stale.
    location = /index.html {
      add_header  Cache-Control "no-cache";
    }

    location / {
      index  index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
